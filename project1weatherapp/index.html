<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="weather-container">
            <div class="temp">
                <p>20</p>
            </div>
            <div class="location">
                <p> Delhi </p>
                <p> 2025-03-17 Monday 8:00</p>
            </div>
            <div class="img">
                
                <p>mist</p>
            </div>
        </div>
        <nav>
            <form>
                <input  type="text" placeholder="search for location" class="search-area">
                <br>
                <button type="submit" class="search_button">search button</button>
            </form>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
